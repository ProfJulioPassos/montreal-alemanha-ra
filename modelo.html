<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071324"><title>Maquete 3D · Portão de Brandemburgo | Montreal</title><link rel="stylesheet" href="assets/style.css"><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="assets/portao.js"></script>
<style>body{overflow:hidden}.model-scene{position:fixed;inset:0}.model-scene a-scene{height:100%;width:100%}.viewer-hud{position:fixed;inset:0;display:flex;justify-content:space-between;flex-direction:column;pointer-events:none;z-index:2}.viewer-hud>*{pointer-events:auto}.viewer-hud header{padding:18px;background:linear-gradient(#0009,transparent)}.viewer-hud footer{padding:25px 18px max(30px,env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,#031222cc);font-size:13px;color:#d6e6f2}.viewer-hud a{color:#f3d9a4}.viewer-hud button{border-radius:9px;padding:10px 18px;margin:0 3px;background:#e4bc72;color:#102236;border:0;font-size:17px;font-weight:700}.model-note{font-size:12px;color:#bacddc;line-height:1.5}</style></head><body>
<div class="model-scene" id="drag-area"><a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true; colorManagement:true" background="color:#0b1b2d" loading-screen="enabled:false">
<a-entity id="turntable" position="0 -1.1 0" portao-montreal scale="1.16 1.16 1.16" rotation="0 -22 0"></a-entity>
<a-entity camera id="cam" position="0 2.6 11" look-controls="enabled:false"></a-entity>
<a-entity light="type: ambient; color:#ffffff; intensity: 1.1"></a-entity><a-entity light="type: directional; color:#ffe7ba; intensity: 2" position="-4 9 7"></a-entity>
<a-entity light="type: directional; color:#c2defa; intensity: 1.3" position="4 5 -6"></a-entity></a-scene></div>
<div class="viewer-hud"><header><div class="eyebrow">Montreal · Alemanha</div><h1 style="font-size:25px;margin:6px 0">Portão de Brandemburgo</h1><a href="index.html" style="font-size:13px">← Voltar</a></header>
<footer><p style="margin:0 0 12px;color:#f8f7f1">Arraste o dedo para girar a maquete 3D</p><div><button id="zoom-in" aria-label="Aproximar">＋</button><button id="reset" aria-label="Reiniciar">↻</button><button id="zoom-out" aria-label="Afastar">－</button></div><p class="model-note">Maquete educativa estilizada, livre para explorar sem abrir a câmera.<br>Construído entre 1788 e 1791 · Berlim, Alemanha</p></footer></div>
<script>
(()=>{
const target=document.getElementById('turntable'),area=document.getElementById('drag-area'),cam=document.getElementById('cam');let grab=false,px=0,py=0,ry=-22,rx=0,z=11;
function render(){target.setAttribute('rotation',`${rx} ${ry} 0`);cam.setAttribute('position',`0 2.6 ${z}`)}
area.addEventListener('pointerdown',e=>{grab=true;px=e.clientX;py=e.clientY;area.setPointerCapture?.(e.pointerId)});
area.addEventListener('pointermove',e=>{if(!grab)return;ry+=(e.clientX-px)*.44;rx=Math.max(-24,Math.min(24,rx+(e.clientY-py)*.18));px=e.clientX;py=e.clientY;render()});
area.addEventListener('pointerup',()=>grab=false);area.addEventListener('pointercancel',()=>grab=false);
document.getElementById('zoom-in').onclick=()=>{z=Math.max(6,z-1);render()};document.getElementById('zoom-out').onclick=()=>{z=Math.min(18,z+1);render()};document.getElementById('reset').onclick=()=>{rx=0;ry=-22;z=11;render()};
})();
</script></body></html>
